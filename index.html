<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora de Plazos Chile 2026</title>
<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f4f4;
    margin:0;
    padding:30px;
}
.container{
    max-width:900px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 2px 12px rgba(0,0,0,.1);
}
h1{
    margin-top:0;
}
label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}
input,select,button{
    width:100%;
    padding:12px;
    margin-top:6px;
    box-sizing:border-box;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:16px;
}
button{
    margin-top:20px;
    background:#111827;
    color:white;
    cursor:pointer;
    border:none;
}
button:hover{
    opacity:.92;
}
.resultado{
    margin-top:25px;
    padding:18px;
    background:#f9fafb;
    border-radius:10px;
    border:1px solid #ddd;
}
.timeline{
    margin-top:15px;
}
.timeline-item{
    padding:8px 0;
    border-bottom:1px solid #eee;
}
.ok{
    color:green;
}
.no{
    color:#b91c1c;
}
.small{
    color:#555;
    font-size:14px;
}
</style>
</head>
<body>
<div class="container">
<h1>Calculadora de Plazos Chile 2026</h1>

<label>Fecha de inicio</label>
<input type="date" id="fecha">

<label>Cantidad de días</label>
<input type="number" id="dias" value="5" min="1">

<label>Tipo de plazo</label>
<select id="tipo">
<option value="administrativo">Administrativo</option>
<option value="judicial">Judicial</option>
</select>

<button onclick="calcular()">Calcular plazo</button>

<div class="resultado" id="resultado">
Ingresa los datos y presiona calcular.
</div>
</div>

<script>
const FERIADOS_2026 = [
'2026-01-01',
'2026-04-03',
'2026-04-04',
'2026-05-01',
'2026-05-21',
'2026-06-21',
'2026-06-29',
'2026-07-16',
'2026-08-15',
'2026-09-18',
'2026-09-19',
'2026-10-12',
'2026-10-31',
'2026-11-01',
'2026-12-08',
'2026-12-25'
];

function formatISO(date){
    return date.toISOString().split('T')[0];
}

function formatCL(date){
    return date.toLocaleDateString('es-CL',{
        year:'numeric',
        month:'long',
        day:'numeric'
    });
}

function esFeriado(date){
    return FERIADOS_2026.includes(formatISO(date));
}

function esHabil(date,tipo){
    const day = date.getDay();

    if(esFeriado(date)) return false;
    if(day === 0) return false;

    if(tipo === 'administrativo' && day === 6){
        return false;
    }

    return true;
}

function calcular(){
    const fecha = document.getElementById('fecha').value;
    const dias = parseInt(document.getElementById('dias').value);
    const tipo = document.getElementById('tipo').value;
    const resultado = document.getElementById('resultado');

    if(!fecha || !dias){
        alert('Completa todos los campos.');
        return;
    }

    let actual = new Date(fecha + 'T00:00:00');
    let cont = 0;
    let timeline = [];

    while(cont < dias){
        actual.setDate(actual.getDate() + 1);

        const habil = esHabil(actual,tipo);

        timeline.push({
            fecha: new Date(actual),
            habil: habil
        });

        if(habil){
            cont++;
        }
    }

    let html = `
        <h2>Resultado</h2>
        <p><strong>Fecha final:</strong> ${formatCL(actual)}</p>
        <p class="small">
            Tipo de plazo: ${tipo}<br>
            Días hábiles contabilizados: ${dias}
        </p>
        <div class="timeline">
            <h3>Detalle del cómputo</h3>
    `;

    timeline.forEach((item,index)=>{
        html += `
        <div class="timeline-item">
            ${index+1}. ${formatCL(item.fecha)}
            ${item.habil
                ? '<span class="ok"> — hábil</span>'
                : '<span class="no"> — inhábil</span>'
            }
        </div>
        `;
    });

    html += '</div>';

    resultado.innerHTML = html;
}
</script>
</body>
</html>
